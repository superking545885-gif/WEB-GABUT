    // ==================== EXPIRED DATE FUNCTIONS ====================
    function parseDateString(dateString) {
        // Format: YYYY-MM-DD (dari input date)
        if (!dateString) return null;
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return null;
        return date;
    }

    function isExpired(expiredDate) {
        if (!expiredDate) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const expired = new Date(expiredDate);
        expired.setHours(0, 0, 0, 0);
        return expired < today;
    }

    function formatDateForDisplay(dateString) {
        if (!dateString) return "-";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return "-";
        const day = date.getDate().toString().padStart(2, '0');
        const month = (date.getMonth() + 1).toString().padStart(2, '0');
        const year = date.getFullYear();
        return `${day}-${month}-${year}`;
    }

    // Auto hapus akun expired
    function checkAndDeleteExpiredAccounts() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const beforeCount = usersDB.length;
        
        usersDB = usersDB.filter(user => {
            if (user.expiredDate) {
                const expired = new Date(user.expiredDate);
                expired.setHours(0, 0, 0, 0);
                if (expired < today) {
                    console.log(`Akun ${user.username} (${user.role}) expired dan dihapus otomatis`);
                    return false;
                }
            }
            return true;
        });
        
        // Jika current user expired, logout
        if (currentUser && isExpired(currentUser.expiredDate)) {
            currentUser = null;
            return true; // perlu redirect ke landing
        }
        return false;
    }

    // Panggil setiap kali mount dan setiap 1 menit
    setInterval(() => {

                        <div v-if="subMenu === 'anime'" class="card"><h4>NONTON ANIME (API)</h4><div class="anime-search-area"><input type="text" v-model="searchQuery" placeholder="Cari anime..." @keyup.enter="searchAnime"><button @click="searchAnime">CARI ANIME</button></div><div v-if="animeLoading" class="loading-spinner"><div class="spinner"></div><p>Mencari anime...</p></div><div v-if="!selectedAnimeDetail && searchResults.length > 0" class="anime-results"><div v-for="anime in searchResults" :key="anime.id" class="anime-result-item" @click="selectAnime(anime)"><div class="anime-result-title">{{ anime.title }}</div><div class="anime-result-info" v-if="anime.status">Status: {{ anime.status }}</div></div></div><div v-if="selectedAnimeDetail && !selectedEpisode"><button class="secondary" @click="selectedAnimeDetail=null">← Kembali</button><h4 style="text-align:center;">{{ selectedAnimeDetail.title }}</h4><div v-if="episodeLoading" class="loading-spinner"><div class="spinner"></div><p>Memuat episode...</p></div><div class="episode-list" v-else><div v-for="ep in episodeList" :key="ep.number" class="episode-btn" @click="playEpisode(ep)">Episode {{ ep.number }}</div></div></div><div v-if="selectedEpisode"><button class="secondary" @click="selectedEpisode=null">← Kembali</button><h4>{{ selectedAnimeDetail?.title }} - Episode {{ selectedEpisode.number }}</h4><div v-if="streamingLoading" class="loading-spinner"><div class="spinner"></div><p>Memuat video...</p></div><div v-else-if="streamingUrl" class="video-player"><iframe :src="streamingUrl" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe></div><div class="episode-list" style="margin-top:10px;"><div v-for="ep in episodeList.slice(0,15)" :key="ep.number" class="episode-btn" @click="playEpisode(ep)">EP {{ ep.number }}</div></div></div><button class="secondary" style="margin-top:15px;" @click="subMenu=null">Tutup</button></div>
                        <div v-if="subMenu === 'quran'" class="card"><h4>AL-QURAN DIGITAL</h4><input v-model="searchSurah" placeholder="Cari surah..."><div class="surah-list" v-if="!selectedSurah"><div v-for="surah in filteredSurah" :key="surah.number" class="surah-item" @click="selectSurah(surah.number)"><div class="surah-number">{{ surah.number }}</div><div class="surah-name">{{ surah.name }}<br><small class="surah-info">{{ surah.nameId }} | {{ surah.totalVerses }} ayat</small></div><div>📖</div></div></div><div v-if="selectedSurah"><button class="secondary" @click="selectedSurah=null">← Kembali</button><h4 style="text-align:center;">{{ selectedSurahData?.name }}</h4><div class="ayat-list"><div v-for="ayat in ayatData" :key="ayat.number" class="ayat-card"><div class="ayat-number">Ayat {{ ayat.number }}</div><div class="ayat-arabic">{{ ayat.arab }}</div><div class="ayat-latin">{{ ayat.latin }}</div><div class="ayat-arti">{{ ayat.arti }}</div></div></div></div><button class="secondary" style="margin-top:15px;" @click="subMenu=null">Tutup</button></div>
                        <div v-if="subMenu === 'chatOwner'" class="card"><div class="chat-messages" ref="privateChatMsgs" style="height:300px; overflow-y:auto;"><div v-for="(msg, idx) in privateMessages" :key="idx" :class="['chat-message', msg.from === 'owner' ? 'owner' : 'user']"><strong>{{ msg.from === 'owner' ? 'Owner' : 'Anda' }}:</strong> {{ msg.text }}<div style="font-size:10px;">{{ formatTime(msg.time) }}</div></div></div><div class="chat-input-area"><input type="text" v-model="newPrivateMsg" placeholder="Tulis pesan ke Owner..." @keyup.enter="sendPrivateMessage"><button @click="sendPrivateMessage">Kirim</button></div><button class="secondary" style="margin-top:15px;" @click="subMenu=null">Tutup</button></div>
                        <div v-if="subMenu === 'groupChat'" class="card"><div class="group-chat-messages" ref="groupChatMsgs" style="height:350px; overflow-y:auto;"><div v-for="(msg, idx) in groupMessages" :key="idx" :class="['group-message', getGroupMessageClass(msg)]"><div class="message-sender">{{ msg.from === currentUser.username ? 'Anda' : msg.from }} <span style="font-size:9px;">({{ getRoleName(msg.role) }})</span></div><div>{{ msg.text }}</div><div style="font-size:9px;">{{ formatTime(msg.time) }}</div></div></div><div class="chat-input-area"><input type="text" v-model="newGroupMsg" placeholder="Pesan ke grub..." @keyup.enter="sendGroupMessage"><button @click="sendGroupMessage">Kirim ke Grub</button></div><button class="secondary" style="margin-top:15px;" @click="subMenu=null">Tutup</button></div>
                        <div v-if="subMenu === 'ownerChat' && currentUser.role === 'owner'" class="card"><div class="chat-list" v-if="!selectedOwnerChat"><div v-for="chat in privateChats" :key="chat.userId" class="chat-room-item" @click="selectOwnerChat(chat)"><div class="chat-room-name">User: {{ chat.username }}</div><div class="chat-room-preview">{{ getLastMessageText(chat) }}</div></div></div><div v-if="selectedOwnerChat"><button class="secondary" @click="selectedOwnerChat=null">← Kembali</button><div class="chat-messages" ref="ownerChatMsgs" style="height:300px; overflow-y:auto;"><div v-for="(msg, idx) in selectedOwnerChat.messages" :key="idx" :class="['chat-message', msg.from === 'owner' ? 'owner' : 'user']"><strong>{{ msg.from === 'owner' ? 'Owner (Anda)' : selectedOwnerChat.username }}:</strong> {{ msg.text }}<div style="font-size:10px;">{{ formatTime(msg.time) }}</div></div></div><div class="chat-input-area"><input type="text" v-model="newOwnerReply" placeholder="Ketik balasan..." @keyup.enter="sendOwnerReply"><button @click="sendOwnerReply">Kirim Balasan</button></div></div><button class="secondary" style="margin-top:15px;" @click="subMenu=null">Tutup</button></div>
                    </div>

                    <!-- AKUN -->
                    <div v-if="activeTab === 'account'">
                        <div class="card">
                            <h3>TENTANG AKUN WIBU</h3>
                            <div class="avatar-preview" v-html="getAvatarHtmlLarge()"></div>
                            <div style="text-align:center; margin-bottom:15px;">
                                <label class="file-input-label">Pilih dari Gallery<input type="file" accept="image/*" @change="uploadAvatar" capture></label>
                                <button class="secondary" style="margin-top:5px;" @click="showEmojiSelector = !showEmojiSelector">Gunakan Emoji</button>
                            </div>
                            <div v-if="showEmojiSelector" style="text-align:center; margin:10px 0; max-height:200px; overflow-y:auto;"><div v-for="emoji in avatarOptions" :key="emoji" class="avatar-option" :class="{selected: currentUser.avatar === emoji && !isImageAvatar}" @click="selectEmoji(emoji)" style="display:inline-flex;"><span style="font-size:30px;">{{ emoji }}</span></div></div>
                            <p><strong>Username:</strong> {{ currentUser.username }}</p>
                            <p><strong>Role:</strong> {{ getRoleName(currentUser.role) }}</p>
                            <p><strong>Durasi:</strong> {{ currentUser.duration }}</p>
                            <p><strong>Tanggal Expired:</strong> {{ formatExpiredDateForDisplay(currentUser.expiredDate) }}</p>
                            <div v-if="isUserExpired" class="alert-danger">Akun wibu Anda telah kedaluwarsa! Silakan perpanjang.</div>
                            <hr>
                            <button class="danger" @click="logout" style="margin-top:10px;">GANTI AKUN (LOGOUT)</button>
                        </div>
                    </div>

                    <!-- FITUR KHUSUS dengan input tanggal manual -->
                    <div v-if="activeTab === 'fiturkhusus' && (currentUser.role === 'tangan_kanan' || currentUser.role === 'reseller' || currentUser.role === 'owner')">
                        <div class="card"><h3>INFO AKUN WIBU</h3><div class="user-list"><div v-for="user in allUsers" :key="user.id" class="user-item"><div><strong>{{ user.username }}</strong> <span style="color:#4a9eff;">({{ getRoleName(user.role) }})</span><br><small>Durasi: {{ user.duration }} | Expired: {{ formatExpiredDateForDisplay(user.expiredDate) }}</small></div><div class="sender-actions" v-if="currentUser.role === 'owner' && user.username !== 'WibuMaster'"><button class="danger" @click="deleteAccount(user.id)">Hapus</button></div></div></div></div>
                        <div class="card">
                            <h3>BUAT AKUN WIBU BARU</h3>
                            <input v-model="newUsername" placeholder="Username">
                            <input type="password" v-model="newPassword" placeholder="Password">
                            <select v-model="newRole">
                                <option v-if="currentUser.role === 'owner'" value="tangan_kanan">Tangan Kanan Owner</option>
                                <option v-if="currentUser.role === 'owner'" value="reseller">Reseller</option>
                                <option value="vip">VIP</option>
                                <option value="member">Member</option>
                            </select>
                            <select v-model="newDuration">
                                <option v-if="currentUser.role === 'owner' || currentUser.role === 'tangan_kanan'" value="permanen">Permanen</option>
                                <option value="30 hari">30 Hari</option>
                                <option value="7 hari">7 Hari</option>
                            </select>
                            <div class="date-input-wrapper">
                                <input type="date" v-model="newExpiredDate" placeholder="Tanggal Expired (YYYY-MM-DD)">
                                <div class="date-note">Format: YYYY-MM-DD (contoh: 2025-12-31)</div>
                            </div>
                            <button @click="createAccount">BUAT AKUN</button>
                            <p v-if="createMsg" class="alert-success">{{ createMsg }}</p>
                        </div>
                    </div>

                    <div class="developer-footer">Developed by LANZY</div>
                </div>

                <div class="bottom-nav">
                    <button class="nav-item" :class="{active: activeTab === 'home'}" @click="activeTab = 'home'"><span class="nav-icon">🏠</span><span>Home</span></button>
                    <button class="nav-item" :class="{active: activeTab === 'bugwa'}" @click="activeTab = 'bugwa'"><span class="nav-icon">🐞</span><span>Bug</span></button>
                    <button class="nav-item" :class="{active: activeTab === 'tools'}" @click="activeTab = 'tools'; subMenu=null"><span class="nav-icon">🛠️</span><span>Tools</span></button>
                    <button class="nav-item" :class="{active: activeTab === 'account'}" @click="activeTab = 'account'"><span class="nav-icon">👤</span><span>Akun</span></button>
                    <button class="nav-item" v-if="currentUser.role === 'tangan_kanan' || currentUser.role === 'reseller' || currentUser.role === 'owner'" :class="{active: activeTab === 'fiturkhusus'}" @click="activeTab = 'fiturkhusus'"><span class="nav-icon">👑</span><span>Fitur Khusus</span></button>
                </div>
                <div v-if="isLoading" class="loading-overlay"><div class="spinner"></div></div>
            </div>
        `,
        data() {
            return {
                activeTab: 'home',
                subMenu: null,
                sendersDB: sendersDB,
                bugModes: bugModes,
                surahList: surahList,
                targetNomor: '',
                selectedSenderId: 1,
                lastResult: '',
                newSenderNomor: '',
                newSenderNama: '',
                kotaSholat: 'Jakarta',
                sholatData: null,
                loadingSholat: false,
                sholatInfo: '',
                tiktokUrl: '',
                tiktokResult: '',
                hdResult: '',
                selectedFile: null,
                newUsername: '',
                newPassword: '',
                newRole: 'vip',
                newDuration: '30 hari',
                newExpiredDate: '',
                createMsg: '',
                isLoading: false,
                searchSurah: '',
                selectedSurah: null,
                selectedSurahData: null,
                loadingAyat: false,
                ayatData: [],
                searchQuery: '',
                searchResults: [],
                searchPerformed: false,
                animeLoading: false,
                selectedAnimeDetail: null,
                episodeList: [],
                episodeLoading: false,
                selectedEpisode: null,
                streamingUrl: null,
                streamingLoading: false,
                privateMessages: [],
                newPrivateMsg: '',
                newGroupMsg: '',
                selectedOwnerChat: null,
                newOwnerReply: '',
                privateChats: privateChats,
                groupMessages: groupMessages,
                showEmojiSelector: false,
                avatarOptions: avatarOptions,
                isImageAvatar: false
            }
        },
        computed: {
            currentUser() { return currentUser },
            allUsers() { return usersDB },
            isVipOrAbove() { return ['vip', 'reseller', 'tangan_kanan', 'owner'].includes(currentUser?.role); },
            isUserExpired() { return isExpired(currentUser?.expiredDate); },
            filteredSurah() {
                if (!this.searchSurah) return this.surahList;
                return this.surahList.filter(s => s.name.toLowerCase().includes(this.searchSurah.toLowerCase()) || s.nameId.toLowerCase().includes(this.searchSurah.toLowerCase()));
            }
        },
        mounted() { 
            this.fetchSholat(); 
            this.initDinoGame();
            this.isImageAvatar = currentUser.avatar && currentUser.avatar.startsWith('data:image');
            this.$nextTick(() => {
                const video = this.$refs.bugVideo;
                if (video) {
                    video.play().catch(e => console.log("Auto play failed:", e));
                    setTimeout(() => { if (video) video.muted = false; }, 500);
                }
            });
        },
        methods: {
            formatExpiredDateForDisplay(date) { return formatDateForDisplay(date); },
            getAvatarHtml() {
                if (currentUser.avatar && currentUser.avatar.startsWith('data:image')) {
                    return `<img src="${currentUser.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                return `<span style="font-size:30px;">${currentUser.avatar || '👤'}</span>`;
            },
            getAvatarHtmlLarge() {
                if (currentUser.avatar && currentUser.avatar.startsWith('data:image')) {
                    return `<img src="${currentUser.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                return `<span style="font-size:50px;">${currentUser.avatar || '👤'}</span>`;
            },
            uploadAvatar(event) {
                const file = event.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const avatarData = e.target.result;
                        currentUser.avatar = avatarData;
                        const userIndex = usersDB.findIndex(u => u.id === currentUser.id);
                        if (userIndex !== -1) usersDB[userIndex].avatar = avatarData;
                        this.isImageAvatar = true;
                        this.showEmojiSelector = false;
                        this.$forceUpdate();
                    };
                    reader.readAsDataURL(file);
                } else { alert("Silakan pilih file gambar!"); }
            },
            selectEmoji(emoji) {
                currentUser.avatar = emoji;
                const userIndex = usersDB.findIndex(u => u.id === currentUser.id);
                if (userIndex !== -1) usersDB[userIndex].avatar = emoji;
                this.isImageAvatar = false;
                this.showEmojiSelector = false;
                this.$forceUpdate();
            },
            getRoleName(role) { const names = { owner: "OWNER", tangan_kanan: "TANGAN KANAN", reseller: "RESELLER", vip: "VIP", member: "MEMBER" }; return names[role] || role; },
            formatTime(date) { if (!date) return ""; const d = new Date(date); return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; },
            getGroupMessageClass(msg) { if (msg.from === currentUser.username) return 'group-message-user'; if (msg.from === 'WibuMaster' || msg.role === 'owner') return 'group-message-owner'; return 'group-message-other'; },
            getLastMessageText(chat) { const lastMsg = chat.messages[chat.messages.length - 1]; return lastMsg ? lastMsg.text.substring(0, 40) : "Tidak ada pesan"; },
            logout() { currentUser = null; this.$root.currentView = 'landing'; },
            
            async fetchSholat() { 
                if (!this.kotaSholat) return; 
                this.loadingSholat = true; 
                try { 
                    const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${this.kotaSholat}&country=Indonesia&method=2`); 
                    const data = await res.json(); 
                    if(data.code === 200) { 
                        const t = data.data.timings; 
                        this.sholatData = { Imsak: t.Imsak, Subuh: t.Fajr, Dzuhur: t.Dhuhr, Ashar: t.Asr, Maghrib: t.Maghrib, Isya: t.Isha }; 
                        this.sholatInfo = `${data.data.date.readable} - ${this.kotaSholat}`;
                    }
                } catch(e) { this.sholatData = null; this.sholatInfo = "Gagal, coba kota lain"; } 
                finally { this.loadingSholat = false; } 
            },
            downloadTikTok() { if(!this.tiktokUrl) return this.tiktokResult = "Masukkan URL!"; this.tiktokResult = "Memproses download..."; setTimeout(()=> this.tiktokResult = "Download berhasil!", 1500); },
            handleFileUpload(e) { this.selectedFile = e.target.files[0]; },
            upscaleMedia() { if(!this.selectedFile) return this.hdResult = "Pilih gambar!"; this.hdResult = "Memproses HD Upscale..."; setTimeout(()=> this.hdResult = "HD berhasil!", 2000); },
            async runBugWithLoading(bugName) {
                if (!this.targetNomor) { this.lastResult = "Masukkan target nomor!"; return; }
                const sender = this.sendersDB.find(s => s.id === this.selectedSenderId);
                if (!sender || !sender.aktif) { this.lastResult = "Sender tidak aktif!"; return; }
                this.isLoading = true;
                await new Promise(resolve => setTimeout(resolve, 2500));
                this.isLoading = false;
                this.lastResult = `${bugName} berhasil dikirim ke ${this.targetNomor} via ${sender.nomor}`;
                setTimeout(() => this.lastResult = '', 4000);
            },
            addSender() { if (!this.newSenderNomor || !this.newSenderNama) return alert("Isi nomor dan nama!"); this.sendersDB.push({ id: nextSenderId++, nomor: this.newSenderNomor, nama: this.newSenderNama, aktif: true }); this.newSenderNomor = ''; this.newSenderNama = ''; alert("Sender ditambahkan!"); },
            toggleSender(id) { const s = this.sendersDB.find(s => s.id === id); if(s) s.aktif = !s.aktif; this.$forceUpdate(); },
            deleteSender(id) { this.sendersDB = this.sendersDB.filter(s => s.id !== id); },
            openSubMenu(menu) { 
                this.subMenu = menu; 
                if(menu === 'game') setTimeout(() => this.initDinoGame(), 100); 
                if(menu === 'quran') { this.selectedSurah = null; this.ayatData = []; } 
                if(menu === 'anime') {
                    this.searchResults = [];
                    this.searchQuery = '';
                    this.searchPerformed = false;
                    this.selectedAnimeDetail = null;
                    this.episodeList = [];
                    this.selectedEpisode = null;
                }
                if(menu === 'chatOwner') {
                    const chat = getOrCreatePrivateChat(currentUser.id, currentUser.username);
                    this.privateMessages = chat.messages;
                    this.scrollToBottom('privateChatMsgs');
                }
                if(menu === 'groupChat') { this.scrollToBottom('groupChatMsgs'); }
                if(menu === 'ownerChat') { this.selectedOwnerChat = null; }
            },
            scrollToBottom(refName) { this.$nextTick(() => { if (this.$refs[refName]) { this.$refs[refName].scrollTop = this.$refs[refName].scrollHeight; } }); },
            async selectSurah(surahNumber) {
                this.selectedSurah = surahNumber;
                this.selectedSurahData = this.surahList.find(s => s.number === surahNumber);
                this.loadingAyat = true;
                this.ayatData = [];
                try {
                    const response = await fetch(`https://equran.id/api/surat/${surahNumber}`);
                    const data = await response.json();
                    if (data && data.ayat) {
                        this.ayatData = data.ayat.map((ayat, index) => ({ number: index + 1, arab: ayat.ar || "", latin: ayat.tr || "", arti: ayat.idn || "" }));
                    }
                } catch(e) { console.error(e); }
                this.loadingAyat = false;
            },
            async searchAnime() {
                if (!this.searchQuery.trim()) { alert("Masukkan judul anime!"); return; }
                this.animeLoading = true;
                this.searchResults = [];
                this.searchPerformed = true;
                try {
                    const response = await fetch(`https://api-santuyy.vercel.app/api/otakudesu/search?q=${encodeURIComponent(this.searchQuery)}`);
                    const data = await response.json();
                    if (data && data.anime && data.anime.length > 0) this.searchResults = data.anime.slice(0, 20);
                } catch (error) { console.error(error); }
                this.animeLoading = false;
            },
            async selectAnime(anime) {
                this.selectedAnimeDetail = anime;
                this.episodeLoading = true;
                this.episodeList = [];
                try {
                    const response = await fetch(`https://api-santuyy.vercel.app/api/otakudesu/anime/${anime.endpoint}`);
                    const data = await response.json();
                    if (data && data.episode_list) {
                        this.episodeList = data.episode_list.map((ep, idx) => ({ number: ep.episode || (idx + 1), endpoint: ep.endpoint }));
                    }
                } catch (error) { console.error(error); }
                this.episodeLoading = false;
            },
            async playEpisode(episode) {
                this.selectedEpisode = episode;
                this.streamingLoading = true;
                this.streamingUrl = null;
                try {
                    const response = await fetch(`https://api-santuyy.vercel.app/api/otakudesu/video/${episode.endpoint}`);
                    const data = await response.json();
                    if (data && data.video_url) this.streamingUrl = data.video_url;
                } catch (error) { console.error(error); }
                this.streamingLoading = false;
            },
            sendPrivateMessage() {
                if (!this.newPrivateMsg.trim()) return;
                const chat = getOrCreatePrivateChat(currentUser.id, currentUser.username);
                chat.messages.push({ from: "user", text: this.newPrivateMsg, time: new Date() });
                this.privateMessages = chat.messages;
                this.newPrivateMsg = "";
                this.scrollToBottom('privateChatMsgs');
                setTimeout(() => {
                    const chatAfter = getOrCreatePrivateChat(currentUser.id, currentUser.username);
                    chatAfter.messages.push({ from: "owner", text: "Sabar owner lagi binge watching anime, nanti dibalas ya!", time: new Date() });
                    this.privateMessages = chatAfter.messages;
                    this.scrollToBottom('privateChatMsgs');
                }, 1500);
            },
            sendGroupMessage() {
                if (!this.newGroupMsg.trim()) return;
                groupMessages.push({ from: currentUser.username, role: currentUser.role, text: this.newGroupMsg, time: new Date() });
                this.newGroupMsg = "";
                this.scrollToBottom('groupChatMsgs');
            },
            selectOwnerChat(chat) { this.selectedOwnerChat = chat; this.newOwnerReply = ""; this.scrollToBottom('ownerChatMsgs'); },
            sendOwnerReply() {
                if (!this.newOwnerReply.trim() || !this.selectedOwnerChat) return;
                this.selectedOwnerChat.messages.push({ from: "owner", text: this.newOwnerReply, time: new Date() });
                this.newOwnerReply = "";
                this.scrollToBottom('ownerChatMsgs');
                this.$forceUpdate();
            },
            createAccount() { 
                if (!this.newUsername || !this.newPassword) { this.createMsg = "Isi semua field!"; return; } 
                if (usersDB.find(u => u.username === this.newUsername)) { this.createMsg = "Username sudah ada!"; return; }
                let expiredDate = null;
                if (this.newDuration !== "permanen") {
                    if (this.newExpiredDate) {
                        expiredDate = this.newExpiredDate;
                    } else {
                        // otomatis hitung dari durasi
                        const today = new Date();
                        if (this.newDuration === "30 hari") today.setDate(today.getDate() + 30);
                        else if (this.newDuration === "7 hari") today.setDate(today.getDate() + 7);
                        expiredDate = today.toISOString().split('T')[0];
                    }
                }
                usersDB.push({ id: nextId++, username: this.newUsername, password: this.newPassword, role: this.newRole, createdBy: this.currentUser.username, duration: this.newDuration, expiredDate: expiredDate, avatar: null });
                this.createMsg = `Akun ${this.getRoleName(this.newRole)} berhasil dibuat! Expired: ${formatDateForDisplay(expiredDate)}`; 
                this.newUsername = ''; this.newPassword = ''; this.newExpiredDate = '';
                setTimeout(() => this.createMsg = '', 3000); 
            },
            deleteAccount(id) { 
                const user = usersDB.find(u => u.id === id); 
                if (!user || user.username === 'WibuMaster') return alert("Tidak bisa hapus owner!"); 
                usersDB = usersDB.filter(u => u.id !== id); 
                alert(`Akun ${user.username} dihapus!`); 
            },
            initDinoGame() { 
                setTimeout(() => { 
                    const canvas = document.getElementById('dinoCanvas'); 
                    if(!canvas) return; 
                    let ctx = canvas.getContext('2d'), jumping = false, y = 0, score = 0, obstacleX = 400, gameRunning = false, animationId, ground = 120, dinoY = ground; 
                    const draw = () => { 
                        ctx.clearRect(0,0,400,150); 
                        ctx.fillStyle = '#1a2a4a'; ctx.fillRect(0,130,400,20); 
                        ctx.fillStyle = '#4a9eff'; ctx.fillRect(30, dinoY, 20, 20); 
                        ctx.fillStyle = '#d45a1a'; ctx.fillRect(obstacleX, ground-15, 15, 15); 
                        ctx.fillStyle = '#4a9eff'; ctx.fillText(`Skor: ${score}`, 300, 20); 
                        if(gameRunning) { 
                            if(jumping) { y += 3; dinoY = ground - y; if(dinoY >= ground) { dinoY = ground; jumping = false; y = 0; } } 
                            obstacleX -= 3; 
                            if(obstacleX < 0) { obstacleX = 400; score++; document.getElementById('scoreDisplay').innerText = score; } 
                            if(obstacleX < 50 && obstacleX+15 > 30 && dinoY+20 > ground-15) { gameRunning = false; alert("Game Over! Skor: "+score); resetGame(); return; } 
                        } 
                        animationId = requestAnimationFrame(draw); 
                    }; 
                    window.startGame = () => { if(!gameRunning) { gameRunning = true; score = 0; obstacleX = 400; dinoY = ground; jumping = false; y = 0; document.getElementById('scoreDisplay').innerText = 0; draw(); } }; 
                    window.addEventListener('keydown', (e) => { if(e.code === 'Space' && gameRunning && !jumping) { e.preventDefault(); jumping = true; y = 12; } }); 
                    canvas.addEventListener('click', () => { if(gameRunning && !jumping) { jumping = true; y = 12; } }); 
                    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameRunning && !jumping) { jumping = true; y = 12; } }); 
                    this.startGame = window.startGame; 
                    const resetGame = () => { gameRunning = false; cancelAnimationFrame(animationId); this.startGame(); }; 
                }, 100); 
            },
            startGame() { if(window.startGame) window.startGame(); }
        },
        updated() { if(this.activeTab === 'tools' && this.subMenu === 'game') this.initDinoGame(); }
    });

    // ==================== VUE INSTANCE ====================
    const app = new Vue({
        el: '#app',
        data: { 
            currentView: 'landing', 
            showGuestChat: false
        },
        render(h) {
            if (this.currentView === 'landing') {
                return h('landing-page', {
                    on: {
                        'get-access': () => { this.showGuestChat = true; this.currentView = 'guest-chat'; this.$forceUpdate(); },
                        'go-to-login': () => { this.currentView = 'login'; this.$forceUpdate(); }
                    }
                });
            }
            if (this.currentView === 'guest-chat' && this.showGuestChat) {
                return h('chat-guest', { on: { close: () => { this.showGuestChat = false; this.currentView = 'landing'; this.$forceUpdate(); } } });
            }
            if (this.currentView === 'login') return h('login-page');
            if (this.currentView === 'video-splash') return h('video-splash');
            if (this.currentView === 'main-app' && currentUser) return h('main-app');
            return h('landing-page');
        }
    });
    
    window.app = app;
</script>
</body>
</html>
